services:
  ninja:
    image: invoiceninja/invoiceninja-debian:latest
    container_name: ninja
    environment:
      - APP_URL=https://ninja.${CASA}
      - APP_KEY=${NINJA_APP_KEY}
      - APP_ENV=production
      - APP_DEBUG=false
      - REQUIRE_HTTPS=true
      - TRUSTED_PROXIES=*
      - PDF_GENERATOR=snappdf
      - PHANTOMJS_PDF_GENERATION=false
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - FILESYSTEM_DISK=debian_docker
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ninja
      - DB_USERNAME=ninja
      - DB_PASSWORD=${NINJA_DB_PASSWORD}
      - IN_USER_EMAIL=cwel@cwel.sh
      - IN_PASSWORD=${NINJA_PASSWORD}
      - MAIL_MAILER=log
      - IS_DOCKER=true
      - SCOUT_DRIVER=null
      - TZ=${TZ}
    volumes:
      - public:/var/www/html/public
      - storage:/var/www/html/storage
    networks:
      - internal
      - stack
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: ninja-web
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - public:/var/www/html/public:ro
      - storage:/var/www/html/storage:ro
    networks:
      - internal
      - stack
    depends_on:
      ninja:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.ninja.rule=Host(`ninja.${CASA}`)
      - traefik.docker.network=internal
      - traefik.http.services.ninja.loadbalancer.server.port=80

  db:
    image: mysql:8
    container_name: ninja-db
    environment:
      MYSQL_DATABASE: ninja
      MYSQL_USER: ninja
      MYSQL_PASSWORD: ${NINJA_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NINJA_DB_ROOT_PASSWORD}
    volumes:
      - ${DOCKERM}/ninja/db:/var/lib/mysql
    networks:
      - stack
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    container_name: ninja-redis
    volumes:
      - ${DOCKERM}/ninja/redis:/data
    networks:
      - stack
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']

  ts:
    image: tailscale/tailscale:latest
    container_name: ninja-ts
    hostname: ninja
    environment:
      - TS_AUTHKEY=${NINJA_TSKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/etc/serve.json
    configs:
      - source: serve
        target: /etc/serve.json
    volumes:
      - ${DOCKERM}/ninja/ts:/var/lib/tailscale
    networks:
      - internal
    restart: unless-stopped

configs:
  serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": { "Proxy": "http://ninja-web:80" }
            }
          }
        }
      }
  nginx:
    content: |
      client_max_body_size 10M;
      client_body_buffer_size 10M;
      server_tokens off;
      fastcgi_buffers 32 16K;

      server {
          listen 80 default_server;
          server_name _;
          root /var/www/html/public;
          index index.php;
          charset utf-8;

          add_header X-Frame-Options "SAMEORIGIN";
          add_header X-Content-Type-Options "nosniff";

          location / {
              try_files $$uri $$uri/ /index.php?$$query_string;
          }

          location = /favicon.ico { access_log off; log_not_found off; }
          location = /robots.txt  { access_log off; log_not_found off; }

          error_page 404 /index.php;

          location ~ \.php$$ {
              fastcgi_pass ninja:9000;
              fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;
              include fastcgi_params;
          }

          location ~ /\.(?!well-known).* {
              deny all;
          }
      }

volumes:
  public:
  storage:

networks:
  internal:
    external: true
  stack:
    internal: true
