services:
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:latest-slim
    container_name: meshcentral
    environment:
      - DYNAMIC_CONFIG=false
      - INSTALL_STYLISHUI=true
      - STYLISHUI_FORCE_LATEST=true
      - TZ=${TZ}
    volumes:
      - ${DOCKERM}/mesh/data:/opt/meshcentral/meshcentral-data
      - ${DOCKERM}/mesh/files:/opt/meshcentral/meshcentral-files
      - ${DOCKERM}/mesh/backups:/opt/meshcentral/meshcentral-backups
    networks:
      - wfg
    restart: unless-stopped
    labels:
      - traefik.wfg=true
      - traefik.http.routers.mesh.rule=Host(`mc.iplawsolutions.com`)
      - traefik.http.services.mesh.loadbalancer.server.port=4430

networks:
  wfg:
    external: true
