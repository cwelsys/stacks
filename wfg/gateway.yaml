services:
  wfg-gw:
    image: tailscale/tailscale:v1.102.5
    container_name: wfg-gw
    hostname: wfg-gw
    environment:
      - TS_AUTHKEY=${WFG_TSKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ${DOCKERM}/wfg-gw/ts:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - wfg
    restart: unless-stopped

  traefikw:
    image: traefik:v3.7.14
    container_name: traefikw
    network_mode: service:wfg-gw
    depends_on:
      - wfg-gw
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=true
      - --providers.docker.constraints=Label(`traefik.wfg`,`true`)
      - --providers.docker.network=wfg
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asDefault=true
      - --entrypoints.websecure.http.tls.certResolver=wfg
      - --entrypoints.websecure.http.tls.domains[0].main=*.iplawsolutions.com
      - --certificatesresolvers.wfg.acme.email=cwel@cwel.sh
      - --certificatesresolvers.wfg.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.wfg.acme.caServer=${WFG_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.wfg.acme.dnsChallenge.provider=cloudflare
      - --certificatesresolvers.wfg.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --log.level=INFO
    volumes:
      - ${DOCKERM}/wfg-gw/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

networks:
  wfg:
    name: wfg
