x-db: &db
  DB_HOST: db
  DB_USER: root
  DB_PASSWORD: ${BIGCAPITAL_DB_ROOT_PASSWORD}
  DB_CHARSET: utf8
  SYSTEM_DB_NAME: bigcapital_system
  TENANT_DB_NAME_PERFIX: bigcapital_tenant_

services:
  bigcapital:
    image: bigcapitalhq/server:v0.15.43
    container_name: bigcapital
    environment:
      <<: *db
      APP_JWT_SECRET: ${BIGCAPITAL_JWT_SECRET}
      BASE_URL: https://books.iplawsolutions.com
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_HOST: redis
      QUEUE_PORT: 6379
      SIGNUP_DISABLED: 'true'
      SIGNUP_EMAIL_CONFIRMATION: 'false'
      GOTENBERG_URL: http://gotenberg:3000
      GOTENBERG_DOCS_URL: http://bigcapital:3000/public/
      CLICKHOUSE_ENABLED: 'false'
      MAIL_HOST: mail
      MAIL_PORT: 587
      MAIL_SECURE: 'false'
      MAIL_FROM_NAME: WFG Books
      MAIL_FROM_ADDRESS: books@iplawsolutions.com
      BANK_FEED_ENABLED: 'true'
      PLAID_ENV: sandbox
      PLAID_CLIENT_ID: ${BIGCAPITAL_PLAID_CLIENT_ID}
      PLAID_SECRET: ${BIGCAPITAL_PLAID_SECRET}
      PLAID_CLIENT_NAME: WFG Books
      PLAID_LINK_WEBHOOK: https://wfg-plaid.${DOMAIN}/api/banking/plaid/webhooks
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${BIGCAPITAL_S3_KEY}
      S3_SECRET_ACCESS_KEY: ${BIGCAPITAL_S3_SECRET}
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: bigcapital
      S3_FORCE_PATH_STYLE: 'true'
    networks:
      - stack
      - wfg
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      garage:
        condition: service_started
    restart: unless-stopped
    labels:
      - traefik.wfg=true
      - traefik.http.routers.bigcapital-api.rule=Host(`books.iplawsolutions.com`) && PathPrefix(`/api`)
      - traefik.http.routers.bigcapital-api.service=bigcapital-api
      - traefik.http.services.bigcapital-api.loadbalancer.server.port=3000

  web:
    image: bigcapitalhq/webapp:v0.15.43
    container_name: bigcapital-web
    networks:
      - wfg
    restart: unless-stopped
    labels:
      - traefik.wfg=true
      - traefik.http.routers.bigcapital.rule=Host(`books.iplawsolutions.com`)
      - traefik.http.routers.bigcapital.service=bigcapital
      - traefik.http.services.bigcapital.loadbalancer.server.port=80

  migrate:
    image: bigcapitalhq/server:v0.15.43
    container_name: bigcapital-migrate
    working_dir: /app/packages/server
    command: sh -c "node dist/cli.js system:migrate:latest && node dist/cli.js tenants:migrate:latest"
    environment:
      <<: *db
    networks:
      - stack
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mariadb:10.2
    container_name: bigcapital-db
    environment:
      MYSQL_DATABASE: bigcapital_system
      MYSQL_ROOT_PASSWORD: ${BIGCAPITAL_DB_ROOT_PASSWORD}
    volumes:
      - ${DOCKERM}/bigcapital/db:/var/lib/mysql
    networks:
      - stack
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20

  dump:
    image: fradelg/mysql-cron-backup:1.15.0
    container_name: bigcapital-dump
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASS: ${BIGCAPITAL_DB_ROOT_PASSWORD}
      MYSQLDUMP_OPTS: --single-transaction --routines --events
      MYSQL_SSL_OPTS: --skip-ssl
      CRON_TIME: 0 3 * * *
      MAX_BACKUPS: 14
      INIT_BACKUP: 1
      TZ: ${TZ}
    volumes:
      - ${DOCKERM}/dumps/bigcapital:/backup
    networks:
      - stack
    depends_on:
      db:
        condition: service_healthy

  mail:
    image: smtp2graph/smtp2graph:v1.1.5
    container_name: bigcapital-mail
    configs:
      - source: smtp2graph
        target: /data/config.yml
    volumes:
      - ${DOCKERM}/bigcapital/mail/client.key:/data/client.key:ro
    networks:
      - stack
      - egress
    restart: unless-stopped

  hook:
    image: nginx:1.28.0-alpine
    container_name: bigcapital-hook
    configs:
      - source: hook
        target: /etc/nginx/conf.d/default.conf
    networks:
      - stack
      - internal
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.public=true
      - traefik.http.routers.bigcapital-plaid.rule=Host(`wfg-plaid.${DOMAIN}`) && Path(`/api/banking/plaid/webhooks`)
      - traefik.docker.network=internal
      - traefik.http.services.bigcapital-plaid.loadbalancer.server.port=80

  redis:
    image: redis:6.2
    container_name: bigcapital-redis
    volumes:
      - ${DOCKERM}/bigcapital/redis:/data
    networks:
      - stack
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:7
    container_name: bigcapital-gotenberg
    networks:
      - stack
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v1.3.1
    container_name: bigcapital-garage
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${BIGCAPITAL_GARAGE_RPC}
      GARAGE_ADMIN_TOKEN: ${BIGCAPITAL_GARAGE_ADMIN}
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      - ${DOCKERM}/bigcapital/garage:/var/lib/garage
    networks:
      - stack
    restart: unless-stopped

configs:
  hook:
    content: |
      server {
        listen 80;
        client_max_body_size 64k;
        location = /api/banking/plaid/webhooks {
          limit_except POST { deny all; }
          proxy_pass http://bigcapital:3000;
        }
        location / { return 404; }
      }
  smtp2graph:
    content: |
      mode: full
      send:
        appReg:
          tenant: 7a3e3d10-f17a-4a7d-b84d-9e6035631207
          id: 1ce7fe5c-aa29-491f-8163-69a2ca0188c8
          certificate:
            thumbprint: 1131A83F373B614C654C3986C3E24A17318EB9DB
            privateKeyPath: client.key
        forceMailbox: books@iplawsolutions.com
      receive:
        port: 587
        allowedFrom:
          - books@iplawsolutions.com
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      block_size = 1048576
      replication_mode = "none"
      rpc_bind_addr = "[::]:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

      [admin]
      api_bind_addr = "[::]:3903"

networks:
  wfg:
    external: true
  internal:
    external: true
  stack:
    internal: true
  egress: {}
