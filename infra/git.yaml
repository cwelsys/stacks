services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      TZ: ${TZ}
      FORGEJO____APP_NAME: The Shed
      FORGEJO__server__DOMAIN: git.${DOMAIN}
      FORGEJO__server__ROOT_URL: https://git.${DOMAIN}/
      FORGEJO__server__SSH_DOMAIN: git.${DOMAIN}
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__SSH_LISTEN_PORT: 22
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__LFS_START_SERVER: true
      FORGEJO__server__LANDING_PAGE: /cwel
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASS}
      FORGEJO__service__DISABLE_REGISTRATION: true
      FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: true
      FORGEJO__repository__DEFAULT_PRIVATE: last
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: true
      FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: true
      FORGEJO__actions__ENABLED: true
      FORGEJO__actions__DEFAULT_ACTIONS_URL: github
      FORGEJO__webhook__ALLOWED_HOST_LIST: external,loopback,private
      FORGEJO__security__INSTALL_LOCK: true
      FORGEJO__log__MODE: file
      FORGEJO__log__LEVEL: Info
    volumes:
      - ${DOCKERM}/forgejo/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 2222:22
    networks:
      - internal
      - public
      - stack
    depends_on:
      forgejo-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.public=true
      - traefik.http.routers.forgejo.rule=Host(`git.${DOMAIN}`)
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
      - traefik.docker.network=internal

  forgejo-db:
    image: postgres:18-alpine
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASS}
    volumes:
      - ${DOCKERM}/forgejo/db:/var/lib/postgresql
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:13
    container_name: forgejo-runner
    restart: unless-stopped
    user: 1000:1000
    working_dir: /data
    command: forgejo-runner daemon -c /data/config.yml
    environment:
      DOCKER_HOST: tcp://host.docker.internal:2375
      TZ: ${TZ}
    volumes:
      - ${DOCKERM}/forgejo/runner:/data
    networks:
      - internal
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - forgejo

  woodpecker:
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker
    restart: unless-stopped
    environment:
      WOODPECKER_HOST: https://ci.${DOMAIN}
      WOODPECKER_OPEN: false
      WOODPECKER_ADMIN: cwel
      WOODPECKER_FORGEJO: true
      WOODPECKER_FORGEJO_URL: https://git.${DOMAIN}
      WOODPECKER_FORGEJO_CLIENT: ${WOODPECKER_CLIENT}
      WOODPECKER_FORGEJO_SECRET: ${WOODPECKER_SECRET}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT}
      TZ: ${TZ}
    volumes:
      - ${DOCKERM}/woodpecker/server:/var/lib/woodpecker
    networks:
      - internal
      - public
    depends_on:
      - forgejo
    labels:
      - traefik.enable=true
      - traefik.public=true
      - traefik.http.routers.woodpecker.rule=Host(`ci.${DOMAIN}`)
      - traefik.http.services.woodpecker.loadbalancer.server.port=8000
      - traefik.docker.network=internal

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    restart: unless-stopped
    environment:
      WOODPECKER_SERVER: woodpecker:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT}
      WOODPECKER_MAX_WORKFLOWS: 1
      WOODPECKER_BACKEND_DOCKER_HOST: tcp://host.docker.internal:2375
      TZ: ${TZ}
    volumes:
      - ${DOCKERM}/woodpecker/agent:/etc/woodpecker
    networks:
      - internal
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - woodpecker

  forgejo-dump:
    image: prodrigestivill/postgres-backup-local:18
    container_name: forgejo-dump
    restart: unless-stopped
    environment:
      POSTGRES_HOST: forgejo-db
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASS}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      TZ: ${TZ}
    volumes:
      - ${DOCKERM}/dumps/forgejo:/backups
    networks:
      - stack
    depends_on:
      forgejo-db:
        condition: service_healthy

networks:
  internal:
    external: true
  public:
    external: true
  stack:
    internal: true
